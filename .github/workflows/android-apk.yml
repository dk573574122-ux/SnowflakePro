name: Build AURIX Pattern Vision APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract AURIX project
        shell: bash
        run: |
          set -euo pipefail
          echo 'Files in repository root:'
          ls -lah

          ZIP=''
          # Prefer the Kotlin-fixed archive over older project archives.
          for candidate in \
            'AURIX_Pattern_Vision_KOTLIN_FIXED.zip' \
            'AURIX_Pattern_Vision_Integrated_Android14_KOTLIN_FIXED.zip' \
            'AURIX_Pattern_Vision_Integrated_Android14-1.zip' \
            'AURIX_Pattern_Vision_Integrated_Android14.zip' \
            'AURIX_Pattern_Vision_Integrated_Android14_WORKFLOW_FIXED.zip' \
            'SnowflakePro_Android14_PhoneBuild.zip'; do
            if [ -f "$candidate" ]; then ZIP="$candidate"; break; fi
          done

          if [ -z "$ZIP" ]; then
            ZIP=$(find . -maxdepth 1 -type f -iname '*AURIX*Pattern*Vision*.zip' -print -quit || true)
          fi

          if [ -z "$ZIP" ]; then
            echo 'AURIX project ZIP not found. Upload the AURIX source ZIP to the repository root.'
            exit 1
          fi

          echo "Selected project archive: $ZIP"
          echo "Selected archive SHA256:"
          sha256sum "$ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          echo 'Kotlin source files found:'
          find extracted -type f -name '*.kt' -print

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)
          if [ -z "$APP" ]; then
            echo 'app/build.gradle.kts not found inside the selected ZIP'
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          APPDIR=$(dirname "$APP")
          PROJ=$(dirname "$APPDIR")
          MAN="$APPDIR/src/main/AndroidManifest.xml"
          if [ ! -f "$MAN" ]; then
            M=$(find "$APPDIR/src/main" -maxdepth 1 -iname 'AndroidManifest.xml*' -print -quit || true)
            if [ -z "$M" ]; then
              echo 'AndroidManifest.xml missing'
              exit 1
            fi
            cp "$M" "$MAN"
          fi

          echo "dir=$PROJ" >> "$GITHUB_OUTPUT"
          echo "app=$APPDIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AURIX-Pattern-Vision-APK
          path: ${{ steps.project.outputs.app }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
