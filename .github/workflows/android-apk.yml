name: Build AURIX APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract exact AURIX source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="AURIX_COMPLETE_SOURCE_FIXED.zip"
          test -f "$ZIP" || { echo "Missing $ZIP"; exit 1; }
          echo "Selected project archive: $ZIP"
          mkdir -p extracted
          unzip -o "$ZIP" -d extracted
      - name: Locate project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)
          test -n "$APP" || { echo "Android app/build.gradle.kts not found"; exit 1; }
          APPDIR=$(dirname "$APP")
          PROJ=$(dirname "$APPDIR")
          echo "project=$PROJ" >> "$GITHUB_OUTPUT"
          echo "app=$APPDIR" >> "$GITHUB_OUTPUT"
      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.locate.outputs.project }}" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AURIX-debug-APK
          path: ${{ steps.locate.outputs.app }}/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
