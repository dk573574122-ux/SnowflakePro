name: Build Snowflake Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o SnowflakePro_Android14_PhoneBuild.zip -d extracted

      - name: Locate Android project and fix Java target
        id: project
        shell: bash
        run: |
          APP_GRADLE=$(find extracted -type f -path '*/app/build.gradle.kts' -print -quit)
          if [ -z "$APP_GRADLE" ]; then
            echo "Could not find app/build.gradle.kts inside the uploaded ZIP."
            echo "Archive contents:"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi
          APP_DIR=$(dirname "$APP_GRADLE")
          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "app_dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          sed -i '/kotlinOptions/i\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' "$APP_GRADLE"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SnowflakePro-APK
          path: ${{ steps.project.outputs.app_dir }}/build/outputs/apk/debug/app-debug.apk
