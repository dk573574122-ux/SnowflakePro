
name: Build AURIX FUTURE VISION

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q AURIX_FUTURE_VISION_V1_BUILD_PACKAGE.zip -d extracted

      - name: Build APK
        run: |
          gradle --no-daemon \
            -p extracted/SnowflakePro_Android14 \
            assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AURIX-FUTURE-VISION-APK
          path: extracted/SnowflakePro_Android14/app/build/outputs/apk/debug/app-debug.apk
