
name: Build AURIX FUTURE VISION

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          archive=""

          while IFS= read -r -d '' file; do
            if unzip -Z1 "$file" | grep -qE '(^|/)settings\.gradle(\.kts)?$'; then
              archive="$file"
              break
            fi
          done < <(find . -maxdepth 2 -type f -iname '*.zip' -print0)

          if [ -z "$archive" ]; then
            echo "Android source ZIP not found."
            echo "Available ZIP files:"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          echo "Found source: $archive"
          unzip -q "$archive" -d extracted

          settings=$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$settings" ]; then
            echo "Gradle settings file not found."
            exit 1
          fi

          project_dir=$(dirname "$settings")
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" --no-daemon assembleDebug
          else
            gradle --no-daemon -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURIX-FUTURE-VISION-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
